
name: Generate Green Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shubham1-yadav
          outputs: |
            dist/github-snake.svg?color_snake=%2300FF66&color_dots=%230D1117,%230B3D20,%230E6B32,%23139B48,%2300FF66
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300FF66&color_dots=%230D1117,%230B3D20,%230E6B32,%23139B48,%2300FF66

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
